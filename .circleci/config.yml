version: 2.1

orbs:
  node: circleci/node@5.0.2

jobs:
  build:
    docker:
      - image: cimg/node:18.16
    steps:
      - checkout
      # Restore cached dependencies based on package.json (since we don't have lockfile yet)
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match
            - v1-dependencies-
      - run:
          name: Install Dependencies
          command: npm install
      - save_cache:
          paths:
            - ./node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
      - run:
          name: Verify Dependencies
          command: npm ls
      - run:
          name: Lint (if available)
          command: |
            if npm run lint 2>/dev/null; then
              echo "Lint passed"
            else
              echo "Lint script not defined or failed; skipping"
            fi
      - run:
          name: Smoke test HTTP server
          command: |
            # Start the app in background
            npm run dev &
            APP_PID=$!
            # Give the app time to start
            sleep 8
            # Check if the app is responding on port 3000 (default from index.js)
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ App is responding on port 3000"
            else
              echo "⚠️ App did not respond on port 3000. Checking if process is still running..."
              if ps -p $APP_PID > /dev/null; then
                echo "App process is still alive (PID: $APP_PID)"
                # Try to see what port it's listening on
                netstat -tlnp | grep :3000 || echo "No process listening on 3000"
              else
                echo "App process exited early. Check logs above."
              fi
              # Exit with error to fail the job
              exit 1
            fi
            # Stop the background app
            kill $APP_PID 2>/dev/null || true

workflows:
  version: 2
  build_and_test:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - master
                - develop
